  </text>
  
  <rect x="320" y="405" width="160" height="28" rx="14" fill="rgba(255, 153, 0, 0.1)" stroke="rgba(255, 153, 0, 0.3)" stroke-width="1.5"/>
  <text x="400" y="423" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#ff9900" text-anchor="middle" letter-spacing="1">
    MD TOUFIQ H. CREATIVE
