<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121418"/>
      <stop offset="50%" stop-color="#1a1d24"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#goldGrad)"/>
  
  <!-- Decorative Grid Lines -->
  <g stroke="#242933" stroke-width="1" opacity="0.5">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" stroke="#ff9900" stroke-width="1.5" opacity="0.1"/>
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" stroke="#ff9900" stroke-width="1.5" opacity="0.1"/>
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>
  
  <!-- Abstract Design Wave/Shapes -->
  <path d="M-50,350 Q200,450 400,320 T850,400 L850,550 L-50,550 Z" fill="rgba(255, 153, 0, 0.03)"/>
  <path d="M-50,300 Q150,250 400,380 T850,220 L850,550 L-50,550 Z" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.15"/>

  <!-- Showcase Box -->
  <rect x="250" y="100" width="300" height="180" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="#242933" stroke-width="1"/>
  
  <!-- Showcase Graph Icon -->
  <g transform="translate(380, 160)" fill="#ff9900" opacity="0.6">
    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
  </g>

  <!-- Typography Labels -->
  <text x="400" y="340" font-family="'Outfit', 'Inter', sans-serif" font-size="24" font-weight="800" fill="#f3f4f6" text-anchor="middle" letter-spacing="1.5">
