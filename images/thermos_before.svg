<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Amateur product shot simulation -->
  <rect width="100%" height="100%" fill="#e5e7eb"/> <!-- Boring gray-white background -->
  
  <!-- Shadow -->
  <ellipse cx="400" cy="420" rx="60" ry="12" fill="#d1d5db"/>
  
  <!-- Poorly lit bottle shape -->
  <g transform="translate(350, 100)">
    <!-- Lid/Cap -->
    <rect x="30" y="10" width="40" height="30" rx="3" fill="#4b5563"/>
    <!-- Neck -->
    <rect x="25" y="40" width="50" height="20" fill="#374151"/>
    <!-- Body -->
    <rect x="10" y="60" width="80" height="240" rx="10" fill="#9ca3af"/>
    <!-- Plastic texture or line -->
    <rect x="10" y="120" width="80" height="15" fill="#7f8c8d" opacity="0.3"/>
  </g>
  
  <!-- Harsh shadows / poor flash lighting effect -->
  <rect x="375" y="100" width="15" height="300" fill="#ffffff" opacity="0.1"/>

  <!-- Dust / grain overlay for poor quality look -->
  <g fill="#9ca3af" opacity="0.5">
    <circle cx="100" cy="80" r="1.5"/>
    <circle cx="220" cy="150" r="1"/>
    <circle cx="140" cy="300" r="2"/>
    <circle cx="680" cy="200" r="1"/>
    <circle cx="550" cy="400" r="1.5"/>
  </g>

  <!-- Boring label text -->
  <text x="400" y="460" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">
    Standard Mobile Phone Camera Shot (Poor Lighting, Dull Colors)
  </text>
</svg>
